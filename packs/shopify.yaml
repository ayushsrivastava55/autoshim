id: shopify
display_name: Shopify
homepage: https://shopify.dev
docs_url: https://shopify.dev/docs
changelog_url: https://shopify.dev/changelog
github_repo: Shopify/shopify-api-js
packages:
  npm: ["@shopify/shopify-api", "shopify-api-node"]
  pypi: [ShopifyAPI]
import_patterns:
  javascript: ["require('@shopify/shopify-api')", "require(\"@shopify/shopify-api\")", "require('shopify-api-node')", "require(\"shopify-api-node\")", "from '@shopify/shopify-api'", "from \"@shopify/shopify-api\""]
  python: ["import shopify", "from shopify", "import ShopifyAPI", "from ShopifyAPI"]
watch:
  - type: github_release
    repo: Shopify/shopify-api-js
  - type: page
    url: https://shopify.dev/changelog
    detection: semantic
    instructions: >
      Alert on API deprecations, removals, newly required fields, and breaking changes.
      Ignore navigation, marketing, and cosmetic edits.
heal:
  languages: [javascript, typescript, python]
  notes: "Shopify API uses versioning through access token scopes and API version dates; changing behavior often requires updating the API version."
